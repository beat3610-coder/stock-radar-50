name: STOCK RADAR verification
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'trade_plan.py'
      - 'trade_execution.py'
      - 'audit_300.py'
      - 'signal_playbook.py'
      - 'test_shared_execution.py'
      - 'engine.py'
      - 'reference_indicators.py'
      - 'test_reference_indicators.py'
      - 'strategy_lab.py'
      - 'test_strategy_filters.py'
      - 'test_entry_quality.py'
      - 'certification.py'
      - 'test_trade_plan_holdout.py'
      - 'test_certification_gate.py'
      - '.github/workflows/verification.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimum test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source syntax
        run: python -m compileall -q app.py engine.py reference_indicators.py trade_plan.py trade_execution.py signal_playbook.py audit_300.py strategy_lab.py certification.py
      - name: Permissive-reference indicator tests
        run: python test_reference_indicators.py
      - name: Shared research execution decision tests
        run: python test_shared_execution.py
      - name: Opening-price net reward/risk tests
        run: python test_entry_quality.py
      - name: Regime filter regression tests
        run: python test_strategy_filters.py
      - name: Historical target and stop tests
        run: python test_trade_plan_holdout.py
      - name: Independent evidence certification tests
        run: python test_certification_gate.py
      - name: Re-evaluate real 300-symbol historical report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from certification import assess
          report=json.loads(Path("data/strategy-lab-latest.json").read_text(encoding="utf-8"))
          result=assess(report)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result["status"]=="NOT_APPROVED", "Never certify already-inspected historical evidence"
          Path("data/certification-recheck.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-radar-certification
          path: data/certification-recheck.json
