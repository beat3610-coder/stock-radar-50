name: Integrated target algorithm tests
on:
  push:
    branches: [main]
    paths: ["engine.py", "trade_plan.py", "test_trade_plan.py", "app.py", "providers.py", "test_quote_verify.py", ".github/workflows/target-analysis-test.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Compile and exercise integrated target engine
        run: |
          python - <<'PY'
          import ast, json, numpy as np, pandas as pd
          for f in ('engine.py','app.py','providers.py'):
              ast.parse(open(f,encoding='utf8').read())
          from engine import compute,evaluate,integrated_targets,apply_target_risk_gate
          rng=np.random.default_rng(42)
          ix=pd.bdate_range('2025-07-01',periods=320)
          close=100+np.arange(320)*0.08+np.sin(np.arange(320)/5)*3
          high=close+1.8; low=close-2.0
          data=pd.DataFrame({'Open':close-0.2,'High':high,'Low':low,
                             'Close':close,'Volume':100000+np.arange(320)*500},index=ix)
          x=compute(data)
          flow={'date':str(ix[-1].date()),'외국인':{'5일':100,'20일':200},
                '기관':{'5일':100,'20일':300}}
          a=evaluate(x,market='KR',flow=flow)
          b=evaluate(x,market='KR',flow=None)
          u=evaluate(x,market='US',flow=None)
          kq=evaluate(x,market='KQ',flow=flow)
          assert kq['target_inputs']=='수급 포함'
          assert kq['technical_max']==80
          assert 'target1' in a and 'target2' in a
          assert 0<=a['target_signal_points']<=100
          assert 0<=b['target_signal_points']<=100
          assert 0<=u['target_signal_points']<=100
          assert a['target_inputs']=='수급 포함'
          assert b['target_inputs']=='수급 제외'
          assert u['target_inputs']=='수급 제외'
          for obj in [a,b,u]:
              if obj['integrated_target'] is not None:
                  assert obj['integrated_target']>obj['price']
                  assert obj['integrated_target'] in [obj['target1'],obj['target2']]
              assert obj['target'] is None or obj['target']>obj['price']
          # Flat-time series: don't invent resistance targets above current price.
          flat=data.copy()
          flat['Close']=100;flat['Open']=100;flat['High']=100.01;flat['Low']=99.99
          flat=compute(flat)
          f=evaluate(flat,market='KR',flow=None)
          assert f['integrated_target'] is None or f['integrated_target']>100
          # Explicitly verify entry guard thresholds and risk-warning precedence.
          def gate(sig,goal,stop=95):
              return apply_target_risk_gate(sig,100,stop,goal)
          assert gate("매수 검토",102)[0]=="상승 신호·매수 유보"  # 2% upside / 0.4R
          assert gate("강한 매수 검토",106)[0]=="상승 신호·매수 유보" # 6% but 1.2R
          assert gate("강한 매수 검토",108)[0]=="강한 매수 검토" # 8% / 1.6R
          assert gate("매수 검토",None)[0]=="상승 신호·매수 유보"
          assert gate("매수 검토",108,stop=None)[0]=="상승 신호·매수 유보"
          assert gate("과열·추격 주의",108)[0]=="과열·추격 주의"
          assert gate("하락 추세·매수 보류",108)[0]=="하락 추세·매수 보류"
          assert gate("기술매수 후보·수급 미확인",108)[0]=="기술매수 후보·수급 미확인"
          assert gate("기술매수 후보·수급 미확인",102)[0]=="기술상승·매수 유보(수급 미확인)"
          assert gate("관찰·수급 미확인",108)[0]=="관찰·수급 미확인"
          future_flow={'date':str((ix[-1]+pd.Timedelta(days=3)).date()),
                       '외국인':{'5일':100,'20일':200},'기관':{'5일':100,'20일':300}}
          future=evaluate(x,market='KQ',flow=future_flow)
          assert future['flow_status']!='정상'
          assert future['target_inputs']=='수급 제외'
          if b['score'] is not None and b['score']>=60:
              assert b['technical_signal_before_gate']=="기술매수 후보·수급 미확인" or "추격" in b['signal'] or "보류" in b['signal'] or "매도" in b['signal']

          for obj in (a,b,u):
              if obj['signal'] in ("매수 검토","강한 매수 검토"):
                  assert obj['upside_pct']>=2.0 and obj['entry_rr']>=1.2
                  assert obj['stop_risk_pct']<=12.0
              if obj['trade_target'] is not None:
                  assert obj['trade_target']>obj['price']
                  assert obj['trade_target2']>=obj['trade_target']
                  assert obj['historical_samples']>=50
          shorter=evaluate(x.iloc[-210:],market='US',flow=None)
          assert shorter['hi52'] is None and shorter['lo52'] is None
          results={'success':True,'entry_guard_passed':True,
                   'review_v2':{'technical_only_gate':True,'future_dated_flow_rejected':True,'full_52wk_only':True},
                   'risk_plan_v1':{'primary_take_profit':'completed_10day_excursion_median',
                                   'threshold_upside_pct':2.0,'threshold_rr':1.2,
                                   'tested':True},
                   'KR':{k:a[k] for k in ('price','target1','target2','integrated_target','target_grade','target_signal_points','target_inputs')},
                   'KR_flow_unavailable':{'integrated_target':b['integrated_target'],'target_inputs':b['target_inputs']},
                   'US':{'integrated_target':u['integrated_target'],'target_inputs':u['target_inputs']}}
          with open('data/target-test-result.json','w') as fh:json.dump(results,fh,ensure_ascii=False,indent=2)
          print(json.dumps(results,ensure_ascii=False))
          PY
      - name: Test secondary quote-date and discrepancy guards
        run: python test_quote_verify.py
      - name: Test risk-first take-profit framework
        run: python test_trade_plan.py
      - name: Commit verification artifact
        if: success()
        run: |
          git config user.name "stock-radar-diagnostics"
          git config user.email "stock-radar-diagnostics@users.noreply.github.com"
          git add data/target-test-result.json data/quote-test-result.json
          git diff --cached --quiet || (git commit -m "Record integrated target algorithm test [skip ci]" && git push)
