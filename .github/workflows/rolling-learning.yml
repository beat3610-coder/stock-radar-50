name: Daily repeated formula tuning and rolling learning
on:
  schedule:
    - cron: "0 0,6,12,18 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "direction3.py"
      - "direction_audit.py"
      - "buy_success.py"
      - ".github/workflows/rolling-learning.yml"
concurrency:
  group: rolling-research-learning
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  learn-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: freshness
        name: Skip repeated runs with the same daily data snapshot
        run: |
          TODAY="$(date -u +%F)"
          PREVIOUS="$(python -c 'import json,pathlib; p=pathlib.Path("data/direction3-rolling-latest.json"); print(json.loads(p.read_text()).get("evaluation_as_of","") if p.exists() else "")')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$PREVIOUS" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already evaluated this daily data snapshot."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install market data and analysis dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Tune frozen candidates on validation and score all 300 stocks
        if: steps.freshness.outputs.skip != 'true'
        run: python direction_audit.py
      - name: Archive rolling report
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rolling-direction-learning
          path: data/direction3-rolling-latest.json
      - name: Publish report to existing dashboard
        if: success() && steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "stock-radar-research"
          git config user.email "stock-radar-research@users.noreply.github.com"
          git add data/direction3-rolling-latest.json
          git diff --cached --quiet || git commit -m "Refresh rolling direction and buy-success report [skip ci]"
          git pull --rebase origin main
          git push
