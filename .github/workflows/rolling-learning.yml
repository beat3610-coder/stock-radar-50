name: Weekly rolling research learning
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "direction_audit.py"
      - ".github/workflows/rolling-learning.yml"
concurrency:
  group: rolling-research-learning
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  learn-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market data and analysis dependencies
        run: pip install -r requirements.txt
      - name: Rebuild online learner from completed outcomes and score all 300 stocks
        run: python direction_audit.py
      - name: Archive rolling report
        uses: actions/upload-artifact@v4
        with:
          name: rolling-direction-learning
          path: data/direction3-rolling-latest.json
      - name: Publish report to existing dashboard
        if: success()
        run: |
          git config user.name "stock-radar-research"
          git config user.email "stock-radar-research@users.noreply.github.com"
          git add data/direction3-rolling-latest.json
          git diff --cached --quiet || git commit -m "Refresh weekly rolling direction and buy-success report [skip ci]"
          git pull --rebase origin main
          git push
