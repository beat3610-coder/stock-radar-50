# manual_generation_request: 3
name: Continuing full-history formula evolution
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "direction3.py"
      - "direction_audit.py"
      - "buy_success.py"
      - "adaptive_trade_plans.py"
      - ".github/workflows/rolling-learning.yml"
concurrency:
  group: rolling-research-learning
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  learn-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: goal
        name: Continue until every market reaches meaningful 50 percent performance
        run: |
          REACHED="$(python -c 'import json,pathlib; p=pathlib.Path("data/direction3-rolling-latest.json"); j=json.loads(p.read_text()) if p.exists() else {}; print("true" if j.get("target_50_all_markets") else "false")')"
          echo "reached=$REACHED" >> "$GITHUB_OUTPUT"
          echo "Previous generation all-market 50 percent, positive net, PF 1.1 status: $REACHED"
      - name: Install market data and analysis dependencies
        if: steps.goal.outputs.reached != 'true'
        run: pip install -r requirements.txt
      - name: Explore a new formula generation over all historical periods
        if: steps.goal.outputs.reached != 'true'
        run: python direction_audit.py
      - name: Archive generation report
        if: steps.goal.outputs.reached != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-history-formula-generation
          path: data/direction3-rolling-latest.json
      - name: Publish generation to the existing dashboard
        if: success() && steps.goal.outputs.reached != 'true'
        run: |
          git config user.name "stock-radar-research"
          git config user.email "stock-radar-research@users.noreply.github.com"
          git add data/direction3-rolling-latest.json
          git diff --cached --quiet || git commit -m "Advance full-history formula generation [skip ci]"
          git pull --rebase origin main
          git push
      - name: Record target reached
        if: steps.goal.outputs.reached == 'true'
        run: echo "All markets reached 50 percent wins with positive net return and profit factor at least 1.1."
