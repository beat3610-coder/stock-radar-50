# manual_generation_request: 2
name: Continuing full-history formula evolution
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "direction3.py"
      - "direction_audit.py"
      - "buy_success.py"
      - "adaptive_trade_plans.py"
      - ".github/workflows/rolling-learning.yml"
concurrency:
  group: rolling-research-learning
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  learn-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market data and analysis dependencies
        run: pip install -r requirements.txt
      - name: Explore a new formula generation over all historical periods
        run: python direction_audit.py
      - name: Archive generation report
        uses: actions/upload-artifact@v4
        with:
          name: full-history-formula-generation
          path: data/direction3-rolling-latest.json
      - name: Publish generation to the existing dashboard
        if: success()
        run: |
          git config user.name "stock-radar-research"
          git config user.email "stock-radar-research@users.noreply.github.com"
          git add data/direction3-rolling-latest.json
          git diff --cached --quiet || git commit -m "Advance full-history formula generation [skip ci]"
          git pull --rebase origin main
          git push
