name: Independent 300-stock trading audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_300.py'
      - '.github/workflows/audit-300.yml'
      - 'engine.py'
      - 'trade_plan.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install beautifulsoup4
      - name: Unit test conservative execution
        run: python -m unittest -v test_audit_300.py
      - name: Audit current constituents, no artificial pass
        run: python audit_300.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-hundred-audit
          path: data/three-hundred-audit.json
          if-no-files-found: warn
