name: Korean common-stock investor flow warmup
on:
  workflow_dispatch:
jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore shared investor-flow cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/flows
          key: stock-radar-pr9-flows-${{ runner.os }}-shared-v1-${{ github.run_id }}
          restore-keys: |
            stock-radar-pr9-flows-${{ runner.os }}-shared-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect cached Korean stock investor-flow histories
        run: python -u flow_warmup.py --time-budget-seconds 3300 --workers 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-stock-flow-warmup
          path: data/flow-warmup-latest.json
          if-no-files-found: warn
      - name: Save shared investor-flow cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/flows
          key: stock-radar-pr9-flows-${{ runner.os }}-shared-v1-${{ github.run_id }}
