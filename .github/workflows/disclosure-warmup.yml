name: Korean company disclosure cache warmup
on:
  workflow_dispatch:
jobs:
  disclosure_warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore shared disclosure cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/disclosures
          key: stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1
          restore-keys: |
            stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Trigger manually in smaller runs across several days; the shared cache resumes incomplete years/pages.
      - name: Collect public DART HTML disclosure histories
        env:
          DISCLOSURE_REQUEST_INTERVAL_SECONDS: "0.5"
        run: python -u disclosure_warmup.py --time-budget-seconds 3300 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-company-disclosure-warmup
          path: data/disclosure-warmup-latest.json
          if-no-files-found: warn
      - name: Save shared disclosure cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/disclosures
          key: stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1-${{ github.run_id }}
