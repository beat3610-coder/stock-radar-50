name: 63 instrument historical buy success audit
on:
  push:
    branches:
      - feature/probability-walkforward-audit-20261118
    paths:
      - '.github/workflows/audit-63-instruments.yml'
      - 'strategy_lab.py'
      - 'audit_63_fast.py'
      - 'universe.py'
  workflow_dispatch:
jobs:
  audit_63:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run 30 KOSPI 30 KOSDAQ 2 TIGER ETFs and SOXL
        run: |
          python -u audit_63_fast.py > audit-63.log 2>&1 || { tail -100 audit-63.log; exit 1; }
          tail -100 audit-63.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-63-buy-success-results
          path: |
            data/audit-63-latest.json
            audit-63.log
