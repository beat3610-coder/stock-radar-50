name: Frozen 63-instrument historical audit
on:
  push:
    branches:
      - feature/probability-walkforward-audit-20261118
      - feature/opendart-earnings-20261125
    paths:
      - '.github/workflows/audit-63-instruments.yml'
      - 'strategy_lab.py'
      - 'audit_63_fast.py'
      - 'universe.py'
      - 'providers.py'
      - 'broad_candidates.py'
      - 'predictive_model.py'
      - 'r_rank_model.py'
      - 'market_context.py'
      - 'expanded_direction_audit.py'
      - 'flow_warmup.py'
      - 'disclosures.py'
      - 'disclosure_warmup.py'
      - 'opendart.py'
      - 'opendart_warmup.py'
      - 'slb.py'
      - 'slb_warmup.py'
      - 'tests/test_opendart.py'
      - 'tests/test_opendart_warmup.py'
      - 'tests/test_earnings_audit.py'
      - '.github/workflows/disclosure-warmup.yml'
      - '.github/workflows/opendart-warmup.yml'
      - '.github/workflows/slb-warmup.yml'
      - 'data/cec6d80-baseline.json'
  pull_request:
    paths:
      - '.github/workflows/audit-63-instruments.yml'
      - 'audit_63_fast.py'
      - 'universe.py'
      - 'providers.py'
      - 'broad_candidates.py'
      - 'predictive_model.py'
      - 'strategy_lab.py'
      - 'r_rank_model.py'
      - 'market_context.py'
      - 'expanded_direction_audit.py'
      - 'flow_warmup.py'
      - 'disclosures.py'
      - 'disclosure_warmup.py'
      - 'opendart.py'
      - 'opendart_warmup.py'
      - 'slb.py'
      - 'slb_warmup.py'
      - 'tests/test_opendart.py'
      - 'tests/test_opendart_warmup.py'
      - 'tests/test_earnings_audit.py'
      - '.github/workflows/disclosure-warmup.yml'
      - '.github/workflows/opendart-warmup.yml'
      - '.github/workflows/slb-warmup.yml'
      - 'data/cec6d80-baseline.json'
  workflow_dispatch:
jobs:
  audit_63:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      OPENDART_WARMUP_WORKERS: "4"
      OPENDART_MAX_REQUESTS_PER_RUN: "6000"
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated public OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/prices
          key: stock-radar-pr9-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-radar-pr9-cache-${{ runner.os }}-${{ github.ref_name }}-
      - name: Restore macro-series cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/indices
          key: stock-radar-pr9-indices-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-radar-pr9-indices-${{ runner.os }}-${{ github.ref_name }}-
      - name: Restore investor-flow cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/flows
          key: stock-radar-pr9-flows-${{ runner.os }}-shared-v1-${{ github.run_id }}
          restore-keys: |
            stock-radar-pr9-flows-${{ runner.os }}-shared-v1-
      - name: Restore company-disclosure cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/disclosures
          key: stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1
          restore-keys: |
            stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1-
      - name: Restore OpenDART financial cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/opendart
          key: stock-radar-pr9-opendart-${{ runner.os }}-shared-v1
          restore-keys: |
            stock-radar-pr9-opendart-${{ runner.os }}-shared-v1-
      - name: Restore securities-lending cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stock-radar/slb
          key: stock-radar-pr9-slb-${{ runner.os }}-shared-v1
          restore-keys: |
            stock-radar-pr9-slb-${{ runner.os }}-shared-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run frozen 30 KOSPI, 30 KOSDAQ, 2 TIGER ETF and SOXL benchmark
        run: |
          python -u audit_63_fast.py > audit-63.log 2>&1 || { tail -100 audit-63.log; exit 1; }
          tail -100 audit-63.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-63-buy-success-results
          path: |
            data/audit-63-latest.json
            audit-63.log
      - name: Save validated public OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/prices
          key: stock-radar-pr9-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Save macro-series cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/indices
          key: stock-radar-pr9-indices-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Save investor-flow cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/flows
          key: stock-radar-pr9-flows-${{ runner.os }}-shared-v1-${{ github.run_id }}
      - name: Save company-disclosure cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/disclosures
          key: stock-radar-pr9-disclosures-${{ runner.os }}-shared-v1-${{ github.run_id }}
      - name: Save OpenDART financial cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/opendart
          key: stock-radar-pr9-opendart-${{ runner.os }}-shared-v1-${{ github.run_id }}
      - name: Save securities-lending cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/stock-radar/slb
          key: stock-radar-pr9-slb-${{ runner.os }}-shared-v1-${{ github.run_id }}
