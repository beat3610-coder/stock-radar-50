name: Risk-first trade plan diagnostics
on:
  push:
    branches: [main]
    paths:
      - "trade_plan.py"
      - "trade_strategy_audit.py"
      - "test_trade_plan.py"
      - ".github/workflows/risk-plan-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy finance-datareader yfinance lxml requests beautifulsoup4 html5lib pykrx
      - name: Test risk-first profit and stop engine
        run: python test_trade_plan.py
      - name: Run 100-ticker historical trade audit
        run: python trade_strategy_audit.py
      - name: Save verification report
        if: always()
        run: |
          if [ -f data/trade-strategy-audit.json ]; then
            git config user.name "stock-radar-diagnostics"
            git config user.email "stock-radar-diagnostics@users.noreply.github.com"
            git add data/trade-strategy-audit.json
            git diff --cached --quiet || (git commit -m "Record risk-first trade strategy audit [skip ci]" && git push)
          fi
