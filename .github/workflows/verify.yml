name: Verify 50 stock market data feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - verify.py
      - providers.py
      - engine.py
      - universe.py
      - .github/workflows/verify.yml
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data dependencies
        run: pip install pandas numpy finance-datareader yfinance pykrx lxml requests
      - name: Verify 50 stocks
        run: python verify.py
      - name: Publish audit report
        run: |
          git config user.name "stock-radar-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json data/verification.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated market data availability report [skip ci]"
            git push
          fi
