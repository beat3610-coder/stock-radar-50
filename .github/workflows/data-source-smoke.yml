name: Stock market data smoke test
on:
  push:
    branches: [main]
    paths: ["providers.py", ".github/workflows/data-source-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-foreign-institution-netbuy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests beautifulsoup4 pykrx
      - name: Test real Samsung Electronics investor data and record diagnostic
        run: |
          python - <<'PY'
          import json, datetime
          from providers import _get_naver_flows
          import requests
          from bs4 import BeautifulSoup
          r=requests.get("https://finance.naver.com/item/frgn.naver?code=005930&page=1",headers={"User-Agent":"Mozilla/5.0"},timeout=15)
          r.encoding="euc-kr"
          soup=BeautifulSoup(r.text,"html.parser")
          tables=[]
          for i,t in enumerate(soup.find_all("table")):
              heads=" | ".join(th.get_text(" ",strip=True) for th in t.find_all("th"))
              rows=t.find_all("tr")
              example=[]
              for tr in rows:
                  cells=tr.find_all("td",recursive=False)
                  if len(cells)>4:
                      example=[c.get_text(" ",strip=True)[:40] for c in cells]
                      break
              if heads or example:
                  tables.append({"index":i,"headers":heads[:260],"row_count":len(rows),"sample":example[:12]})
          print("NAVER HTML DIAGNOSTICS:",json.dumps({"status":r.status_code,"url":r.url,"title":soup.title.get_text(" ",strip=True) if soup.title else "no title","num_tables":len(tables),"sample_tables":tables[:30]},ensure_ascii=False))
          result={"tested_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"ticker":"005930","source":"Naver investor daily","html_diagnostic":{"status":r.status_code,"url":r.url,"title":soup.title.get_text(" ",strip=True) if soup.title else "no title","sample_tables":tables[:30]}}
          try:
              data=_get_naver_flows("005930")
              result["success"]=True
              result["data"]=data
          except Exception as exc:
              result["success"]=False
              result["error"]=f"{type(exc).__name__}: {exc}"
          try:
              api="https://stock.naver.com/api/domestic/detail/005930/trend"
              rr=requests.get(api,params={"tradeType":"KRX","startIdx":0,"pageSize":20},
                  headers={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":"https://stock.naver.com/domestic/stock/005930/investmentinfo"},timeout=15)
              obj=rr.json() if rr.ok else {}
              def brief(v):
                  if isinstance(v,dict):return {k:brief(w) for k,w in list(v.items())[:20]}
                  if isinstance(v,list):return [brief(t) for t in v[:2]]
                  return v
              result["new_naver_api"]={"status":rr.status_code,"url":rr.url,"content_type":rr.headers.get("content-type"),
                                       "body":brief(obj) if obj else rr.text[:350]}
          except Exception as ex:
              result["new_naver_api"]={"error":str(ex)[:350]}
          result["alternative_data_sources"]={}
          tests={
            "github_aggregates":"https://raw.githubusercontent.com/james-brand/korea-market-data/main/data/foreign-flows-aggregates.csv",
            "naver_mobile_front":"https://m.stock.naver.com/front-api/stock/domestic/integration?code=005930",
            "naver_mobile_legacy":"https://m.stock.naver.com/api/stock/005930/integration"
          }
          for key,url in tests.items():
              try:
                  rsp=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/plain,*/*"},timeout=12)
                  record={"status":rsp.status_code,"url":rsp.url,"bytes":len(rsp.content),"content_type":rsp.headers.get("content-type")}
                  if key=="github_aggregates":
                      record["sample"]=rsp.text[:400]
                  else:
                      try:
                          val=rsp.json()
                          record["sample"]=str(val)[:950]
                      except Exception:
                          record["sample"]=rsp.text[:300]
                  result["alternative_data_sources"][key]=record
              except Exception as ex:
                  result["alternative_data_sources"][key]={"error":str(ex)[:220]}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          import os
          os.makedirs("data",exist_ok=True)
          with open("data/flow-diagnostic.json","w",encoding="utf-8") as file:json.dump(result,file,ensure_ascii=False,indent=2)
          PY
      - name: Commit smoke test results
        run: |
          git config user.name "stock-radar-diagnostics"
          git config user.email "stock-radar-diagnostics@users.noreply.github.com"
          git add data/flow-diagnostic.json
          git diff --cached --quiet || (git commit -m "Record market flow diagnostic [skip ci]" && git push)
