name: Research integrity and regime prediction tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "regime_direction.py"
      - "regime_audit_sample.py"
      - "test_regime_direction.py"
      - "research_integrity.py"
      - "test_research_integrity.py"
      - "direction_audit.py"
      - "app.py"
      - ".github/workflows/regime-verification.yml"
permissions:
  contents: read
jobs:
  test-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and causal integrity regression
        run: |
          python -m compileall -q regime_direction.py research_integrity.py direction_audit.py app.py
          python test_research_integrity.py
          python test_regime_direction.py
          python test_direction3.py
          python test_champion_retention.py
      - name: Fixed-watchlist historical direction smoke (research only)
        run: python regime_audit_sample.py
      - name: Archive raw market smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-three-way-smoke
          path: data/regime-smoke-latest.json
          if-no-files-found: warn
