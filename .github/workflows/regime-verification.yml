name: Research integrity and regime prediction tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "regime_direction.py"
      - "regime_audit_sample.py"
      - "test_regime_direction.py"
      - "research_integrity.py"
      - "test_research_integrity.py"
      - "test_three_way_ranking.py"
      - "test_naver_universe.py"
      - "direction_audit.py"
      - "app.py"
      - ".github/workflows/regime-verification.yml"
permissions:
  contents: read
jobs:
  test-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and causal integrity regression
        run: |
          python -m compileall -q regime_direction.py nonlinear_direction.py rolling_refit_direction.py robustness_direction.py regime_probability.py research_integrity.py direction_audit.py app.py
          python test_research_integrity.py
          python test_regime_direction.py
          python test_nonlinear_direction.py
          python test_historical_provider.py
          python test_direction3.py
          python test_three_way_ranking.py
          python test_naver_universe.py
          python test_champion_retention.py
      - name: Fixed-watchlist historical direction smoke (research only)
        run: python regime_audit_sample.py
      - name: Archive raw market smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-three-way-smoke
          path: data/regime-smoke-latest.json
          if-no-files-found: warn

  paired-300-stock-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Compare historical three-way accuracy in 300 current constituents
        run: python -u backtest_300_direction.py
      - name: Archive actual historical research scores including source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-300-direction
          path: data/backtest-300-direction-20261116.json
          if-no-files-found: warn

  long-history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Compare 850d and 5/10/15-year training windows on fixed stocks
        run: python -u long_history_comparison.py
      - name: Archive per-stock history coverage and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-history-research
          path: data/long-history-comparison.json
          if-no-files-found: warn

  korean-100-stock-long-history:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        market: ["KR", "KQ"]
    env:
      STOCK_LONG_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare 100 stocks using identical diagnostic observations
        run: python -u full_korean_long_backtest.py
      - name: Save complete market results even when errors reported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-korean-long-${{ matrix.market }}
          path: data/full-long-${{ matrix.market }}-20261116.json
          if-no-files-found: warn
